name: clean_fastq_headers
description: Replace spaces in FASTQ header lines with underscores before any analysis
tools:
  - pigz:
      description: |
        A parallel implementation of gzip for modern multi-processor,
        multi-core machines.
      homepage: https://zlib.net/pigz/
      documentation: https://zlib.net/pigz/pigz.pdf
      licence: ["Zlib"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - reads:
      type: file
      description: A single FASTQ file (this pipeline is single-end only)
      pattern: "*.{fastq,fastq.gz}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - reads:
      type: file
      description: FASTQ file with spaces in the header lines replaced by underscores
      pattern: "*.clean.fastq.gz"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@Chromojones"
